plugins {
    id 'com.android.application' version '8.9.0'
    id 'org.jetbrains.kotlin.android' version '2.0.21'
}

def webAssets = rootProject.file('../../web/dist-mobile')

android {
    namespace 'best.canvas.preview'
    compileSdk 35

    defaultConfig {
        applicationId 'best.canvas.preview'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    sourceSets.main.assets.srcDir(webAssets)
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

tasks.register('requireWorkbench') {
    doLast {
        if (!new File(webAssets, 'index.html').isFile()) {
            throw new GradleException('请先在仓库根目录运行 pnpm build:mobile:web。')
        }
    }
}
tasks.named('preBuild').configure { dependsOn 'requireWorkbench' }

androidComponents {
    beforeVariants(selector().withBuildType('release')) { variant -> variant.enable = false }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.13.0'
}
